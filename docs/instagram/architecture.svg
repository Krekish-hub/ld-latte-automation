<text x="50" y="1122" class="body">Основной путь — актуальная рекомендация Meta. Для Page-linked Facebook Login и Instagram Login действуют другие токены/права.</text><text x="50" y="1151" class="body">Схема описывает будущую реализацию: реальные аккаунты и API не подключались. Проверки, альтернативы и источники — в README.</text></svg>