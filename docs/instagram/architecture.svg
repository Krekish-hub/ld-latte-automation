<rect x="820" y="940" width="720" height="115" rx="12" fill="#e4ede4"/><text x="842" y="974" class="node-title">Границы данных</text><text x="842" y="1002" class="body">Account: до 90 дней • Media: до 2 лет • Stories: 24 часа</text><text x="842" y="1028" class="body">Задержка расчёта до 48 часов. Пустой ответ ≠ 0.</text>
