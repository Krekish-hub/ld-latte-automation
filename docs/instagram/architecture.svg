<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1210" viewBox="0 0 1600 1210" role="img" aria-labelledby="title desc">
<title id="title">LD LATTE — план сбора статистики Instagram</title>
<desc id="desc">Владелец подключает профессиональные аккаунты через Meta OAuth. Специалист настраивает Unified Login. Сервер получает токен, обнаруживает аккаунты, собирает Insights, сохраняет нормализованные снимки и контролирует доступ.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#577369"/></marker></defs>
